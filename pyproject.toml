[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neo4j-mcp"
version = "0.4.1"
description = "MCP server for Neo4j graph database operations"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.14"
authors = [{ name = "Les Leslie", email = "les@wedgwood.us" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=3.4.0,<4",
    "mcp-common>=0.26.0,<0.27.0",
    "oneiric>=0.16.0",
    "neo4j>=5.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
]

# Pin transitive deps for security (pip-audit CVE fixes). constraint-dependencies
# affects resolution without advertising as direct deps (avoids creosote).
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "crackerjack>=0.50.1",
    "session-buddy>=0.12.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.7.0",
]

[project.scripts]
neo4j-mcp = "neo4j_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/lesleslie/neo4j-mcp"
Repository = "https://github.com/lesleslie/neo4j-mcp.git"

[tool.hatch.build.targets.wheel]
packages = ["neo4j_mcp"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=neo4j_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
]

[tool.coverage.run]
source = ["neo4j_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.creosote]
exclude-deps = ["crackerjack"]

[tool.crackerjack]
# Baseline configuration (auto-bootstrapped 2026-08-20).
# Hook stages run on `crackerjack run`; see crackerjack --help for the
# full lifecycle. refurb_timeout raised from default 300s to 420s because
# large refactor passes on first run can exceed 5 minutes on cold cache.
refurb_timeout = 420
